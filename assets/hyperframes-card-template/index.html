<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js" integrity="sha384-bRevQK3DiusS1XALpRyWfXNcSVNuNxBOUk12Tk44IsnfepFlBwFe8h/82zWbDxqi" crossorigin="anonymous"></script>
    <style>
      @font-face { font-family: "Hiragino Sans GB"; src: local("Hiragino Sans GB"); }
      @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: "Hiragino Sans GB", "PingFang SC", sans-serif; color: #f8f6f3; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(120% 70% at 50% -10%, rgba(196, 86, 58, 0.16), rgba(0, 0, 0, 0) 55%),
          linear-gradient(180deg, #201310 0%, #140c08 45%, #0a0605 100%);
      }
      .clip { position: absolute; inset: 0; }
      /* chip pill — account style */
      #chip {
        position: absolute; top: 112px; left: 50%; margin-left: -140px;
        width: 280px; height: 68px; border-radius: 34px;
        background: rgba(196, 86, 58, 0.95);
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 600; letter-spacing: 2px;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); opacity: 0;
      }
      #title {
        position: absolute; top: 226px; width: 100%;
        text-align: center; font-size: 80px; font-weight: 600;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.55);
      }
      #title span { display: inline-block; }
      #rule {
        position: absolute; top: 382px; left: 50%; width: 320px; margin-left: -160px;
        height: 8px; border-radius: 4px; background: #e2bc68; opacity: 0;
      }
      .panel {
        position: absolute; left: 70px; width: 940px; height: 380px;
        border-radius: 24px; background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.08); opacity: 0;
      }
      #p-clay  { top: 436px; }
      #p-hard  { top: 842px; }
      #p-grass { top: 1248px; }
      .spine {
        position: absolute; left: 0; top: 0; bottom: 0; width: 14px;
        border-radius: 24px 0 0 24px;
      }
      .pname {
        position: absolute; left: 46px; top: 24px;
        font-size: 56px; font-weight: 600; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }
      .itf {
        position: absolute; left: 184px; top: 38px; height: 54px; border-radius: 27px;
        display: flex; align-items: center; padding: 0 20px;
        font-size: 30px; font-weight: 600; opacity: 0;
      }
      .slam {
        position: absolute; right: 26px; top: 38px; height: 54px; border-radius: 27px;
        display: flex; align-items: center; padding: 0 20px;
        background: rgba(255, 255, 255, 0.10); color: #eee2d6;
        font-size: 30px; font-weight: 600; opacity: 0;
      }
      .trait { position: absolute; left: 46px; top: 104px; font-size: 30px; color: #d8cdc0; opacity: 0; }
      .stage { position: absolute; left: 28px; top: 150px; width: 884px; height: 150px; }
      .stage svg { position: absolute; inset: 0; overflow: visible; }
      .ground { position: absolute; left: 0; right: 0; top: 128px; height: 3px; background: rgba(255, 255, 255, 0.24); }
      .ball {
        position: absolute; left: 0; top: 0; width: 26px; height: 26px; margin: -13px;
        border-radius: 50%; opacity: 0;
        background: radial-gradient(circle at 35% 30%, #f4ff86, #d9ec2f 65%, #aebd1e);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
      }
      .fx { position: absolute; opacity: 0; }
      .dust { width: 60px; height: 26px; margin: -13px -30px; border-radius: 50%; background: rgba(206, 110, 80, 0.55); filter: blur(4px); }
      .ring { width: 44px; height: 44px; margin: -22px; border-radius: 50%; border: 4px solid rgba(120, 180, 240, 0.7); }
      .streak { width: 110px; height: 6px; margin: -3px -55px; border-radius: 3px; background: rgba(140, 220, 160, 0.65); filter: blur(1px); }
      .bars { position: absolute; left: 46px; top: 294px; width: 850px; }
      .brow { display: flex; align-items: center; height: 38px; }
      .blab { width: 146px; font-size: 28px; color: #d8cdc0; }
      .btrack { width: 300px; height: 14px; border-radius: 7px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      .bfill { display: block; height: 14px; border-radius: 7px; width: 100%; }
      #tagline {
        position: absolute; top: 1688px; width: 100%; text-align: center;
        font-size: 54px; font-weight: 600; text-shadow: 0 3px 10px rgba(0, 0, 0, 0.55); opacity: 0;
      }
      #footnote {
        position: absolute; top: 1794px; width: 100%; text-align: center;
        font-size: 28px; color: #cbbfae; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="60"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>
      <section id="scene" class="clip" data-start="0" data-duration="10" data-track-index="1">
        <div id="chip">网球小知识</div>
        <h1 id="title"></h1>
        <div id="rule"></div>

        <!-- panels injected per surface -->
        <div class="panel" id="p-clay">
          <div class="spine" style="background: #c4563a"></div>
          <div class="pname">红土</div>
          <div class="itf" id="itf-clay" style="background: #c4563a">ITF 1类 · 慢速</div>
          <div class="slam" id="slam-clay">法网</div>
          <div class="trait" id="trait-clay">弹跳高过肩，回合更长</div>
          <div class="stage">
            <div class="ground"></div>
            <svg viewBox="0 0 884 150">
              <path id="trail-clay-in" d="M -10 10 L 300 128" fill="none" stroke="#e0714e" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 12" />
              <path id="trail-clay-out" d="M 300 128 Q 480 -70 660 104" fill="none" stroke="#e0714e" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 12" />
            </svg>
            <div class="fx dust" id="fx-clay" style="left: 300px; top: 124px"></div>
            <div class="ball" id="ball-clay"></div>
          </div>
          <div class="bars">
            <div class="brow"><span class="blab">球速保留</span><span class="btrack" style="width: 105px"><span class="bfill" id="bar-clay-s" style="background: #c4563a"></span></span></div>
            <div class="brow"><span class="blab">弹跳高度</span><span class="btrack" style="width: 276px"><span class="bfill" id="bar-clay-b" style="background: #c4563a"></span></span></div>
          </div>
        </div>

        <div class="panel" id="p-hard">
          <div class="spine" style="background: #3d7fbf"></div>
          <div class="pname">硬地</div>
          <div class="itf" id="itf-hard" style="background: #3d7fbf">ITF 3-4类 · 中速</div>
          <div class="slam" id="slam-hard">澳网 · 美网</div>
          <div class="trait" id="trait-hard">弹跳规则，攻防平衡</div>
          <div class="stage">
            <div class="ground"></div>
            <svg viewBox="0 0 884 150">
              <path id="trail-hard-in" d="M -10 26 L 300 128" fill="none" stroke="#5f9bd6" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 12" />
              <path id="trail-hard-out" d="M 300 128 Q 520 2 740 110" fill="none" stroke="#5f9bd6" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 12" />
            </svg>
            <div class="fx ring" id="fx-hard" style="left: 300px; top: 128px"></div>
            <div class="ball" id="ball-hard"></div>
          </div>
          <div class="bars">
            <div class="brow"><span class="blab">球速保留</span><span class="btrack" style="width: 186px"><span class="bfill" id="bar-hard-s" style="background: #3d7fbf"></span></span></div>
            <div class="brow"><span class="blab">弹跳高度</span><span class="btrack" style="width: 186px"><span class="bfill" id="bar-hard-b" style="background: #3d7fbf"></span></span></div>
          </div>
        </div>

        <div class="panel" id="p-grass">
          <div class="spine" style="background: #4c9160"></div>
          <div class="pname">草地</div>
          <div class="itf" id="itf-grass" style="background: #4c9160">ITF 5类 · 快速</div>
          <div class="slam" id="slam-grass">温网</div>
          <div class="trait" id="trait-grass">弹跳低且滑，节奏更快</div>
          <div class="stage">
            <div class="ground"></div>
            <svg viewBox="0 0 884 150">
              <path id="trail-grass-in" d="M -10 60 L 300 128" fill="none" stroke="#6fb885" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 12" />
              <path id="trail-grass-out" d="M 300 128 Q 560 88 860 116" fill="none" stroke="#6fb885" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 12" />
            </svg>
            <div class="fx streak" id="fx-grass" style="left: 330px; top: 126px"></div>
            <div class="ball" id="ball-grass"></div>
          </div>
          <div class="bars">
            <div class="brow"><span class="blab">球速保留</span><span class="btrack" style="width: 264px"><span class="bfill" id="bar-grass-s" style="background: #4c9160"></span></span></div>
            <div class="brow"><span class="blab">弹跳高度</span><span class="btrack" style="width: 84px"><span class="bfill" id="bar-grass-b" style="background: #4c9160"></span></span></div>
          </div>
        </div>

        <div id="tagline">同一颗球，三种脾气。</div>
        <div id="footnote">ITF 场地速度分级：1类最慢 — 5类最快</div>
      </section>
    </div>

    <script>
      gsap.registerPlugin(MotionPathPlugin);
      window.__timelines = window.__timelines || {};

      // title -> per-char spans for the staggered rise
      const titleText = "三种球场，弹跳差在哪？";
      const titleEl = document.getElementById("title");
      for (const ch of titleText) {
        const s = document.createElement("span");
        s.textContent = ch;
        titleEl.appendChild(s);
      }

      const tl = gsap.timeline({ paused: true });

      // ---- 0.0-1.3 opening: chip, title chars, gold rule ----
      tl.fromTo("#chip", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.1);
      tl.fromTo("#title span", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.045 }, 0.3);
      tl.fromTo("#rule", { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.95);

      // ---- surface data: paths + timing (clay slow/high, hard medium, grass fast/low) ----
      const SURF = [
        { id: "clay",  at: 1.2, tin: 0.55, tout: 1.10,
          pin: "M -10 10 L 300 128",  pout: "M 300 128 Q 480 -70 660 104" },
        { id: "hard",  at: 3.0, tin: 0.45, tout: 0.80,
          pin: "M -10 26 L 300 128",  pout: "M 300 128 Q 520 2 740 110" },
        { id: "grass", at: 4.6, tin: 0.35, tout: 0.50,
          pin: "M -10 60 L 300 128",  pout: "M 300 128 Q 560 88 860 116" },
      ];

      // trail draw setup: dashoffset over measured length (sync-safe, measured at build time)
      for (const s of SURF) {
        for (const seg of ["in", "out"]) {
          const p = document.getElementById(`trail-${s.id}-${seg}`);
          const L = p.getTotalLength();
          p.style.strokeDasharray = `${L}`;
          p.style.strokeDashoffset = `${L}`;
          p.dataset.len = L;
        }
      }

      // one bounce pass for a surface starting at t0 (used for the intro pass AND the sync replay)
      function bouncePass(s, t0, withFx) {
        const ball = `#ball-${s.id}`;
        tl.set(ball, { opacity: 1 }, t0);
        tl.to(ball, { motionPath: { path: s.pin }, duration: s.tin, ease: "none" }, t0);
        tl.to(ball, { motionPath: { path: s.pout }, duration: s.tout, ease: "power1.out" }, t0 + s.tin);
        if (withFx) {
          const pin = document.getElementById(`trail-${s.id}-in`);
          const pout = document.getElementById(`trail-${s.id}-out`);
          tl.fromTo(`#trail-${s.id}-in`, { strokeDashoffset: +pin.dataset.len }, { strokeDashoffset: 0, duration: s.tin, ease: "none" }, t0);
          tl.fromTo(`#trail-${s.id}-out`, { strokeDashoffset: +pout.dataset.len }, { strokeDashoffset: 0, duration: s.tout, ease: "power1.out" }, t0 + s.tin);
        }
        // impact fx at the bounce moment
        const fx = `#fx-${s.id}`;
        if (s.id === "clay") {
          tl.fromTo(fx, { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.55, ease: "power2.out" }, t0 + s.tin);
        } else if (s.id === "hard") {
          tl.fromTo(fx, { opacity: 0.9, scale: 0.2 }, { opacity: 0, scale: 1.4, duration: 0.45, ease: "power2.out" }, t0 + s.tin);
        } else {
          tl.fromTo(fx, { opacity: 0.85, scaleX: 0.2 }, { opacity: 0, scaleX: 1.5, duration: 0.4, ease: "power1.out" }, t0 + s.tin);
        }
      }

      // ---- per-panel entrance + first bounce pass + bars ----
      for (const s of SURF) {
        tl.fromTo(`#p-${s.id}`, { x: -70, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, s.at);
        tl.fromTo(`#itf-${s.id}`, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, s.at + 0.25);
        tl.fromTo(`#slam-${s.id}`, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, s.at + 0.35);
        tl.fromTo(`#trait-${s.id}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, s.at + 0.4);
        bouncePass(s, s.at + 0.5, true);
        tl.fromTo(`#bar-${s.id}-s`, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, s.at + s.tin + 0.7);
        tl.fromTo(`#bar-${s.id}-b`, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, s.at + s.tin + 0.85);
      }

      // ---- 7.2 signature move: all three balls replay SIMULTANEOUSLY over their trails ----
      for (const s of SURF) {
        tl.to(`#ball-${s.id}`, { opacity: 0, duration: 0.15, ease: "power1.in" }, 7.0);
        bouncePass(s, 7.2, false);
      }

      // ---- 8.9 tagline + footnote, hold to 10 ----
      tl.fromTo("#tagline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 8.85);
      tl.fromTo("#footnote", { opacity: 0 }, { opacity: 0.9, duration: 0.5 }, 9.1);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
